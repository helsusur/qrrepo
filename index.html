<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>student health password scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Loads library directly from web CDN -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body style="
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background-image: url('https://img.magnific.com/free-vector/beautiful-dark-night-space-wallpaper-with-glowing-star_1017-53537.jpg?semt=ais_hybrid&w=740&q=80');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffffff;
">
    <a href=/qrrepo/manual.html>genrate a EQR code...</a>
    <!-- Scanner Container -->
    <div id="scanner" style="width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;"></div>

    <script>
        function unjumbleUrl(text) {
            return text.split('').reverse().join('');
        }

        function onScanSuccess(decodedText) {
            let realUrl = unjumbleUrl(decodedText);
            window.open(realUrl, '_blank');
        }

        const scanner = new Html5QrcodeScanner("scanner", { fps: 15, qrbox: 250 });
        scanner.render(onScanSuccess);
    </script>
</body>
</html>
